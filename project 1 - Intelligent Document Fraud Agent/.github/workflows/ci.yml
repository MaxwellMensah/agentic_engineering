name: Project 1 CI - Intelligent Document Fraud Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-agent:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest fastapi pydantic pydantic-ai httpx; fi

      - name: Run Test Suite
        env:
          # Dummy values so tests pass without real API keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-key-for-tests' }}
        run: |
          pytest -v tests/