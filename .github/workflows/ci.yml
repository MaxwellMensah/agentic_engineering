name: Project 1 CI - Intelligent Document Fraud Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-agent:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Pixi Environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Exact path matching your GitHub subfolder name
          manifest-path: "project 1 - Intelligent Document Fraud Agent/pixi.toml"
          cache: true

      - name: Run Test Suite
        working-directory: "./project 1 - Intelligent Document Fraud Agent"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-key-for-tests' }}
        run: |
          pixi run pytest -v tests/