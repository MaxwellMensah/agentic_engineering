name: Project 1 CI - Intelligent Document Fraud Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-agent:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Pixi Environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Run Test Suite
        env:
          # Dummy values so tests pass without real API keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-key-for-tests' }}
        run: |
          pixi run pytest -v tests/